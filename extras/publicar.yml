# Publica el sitio en GitHub Pages cada vez que se sube un cambio a la rama main
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Verificar que existan las páginas principales
        run: |
          for archivo in index.html excursiones.html reservar.html css/estilos.css; do
            test -f "$archivo" || { echo "Falta $archivo"; exit 1; }
          done
          echo "Todos los archivos están presentes"
      - name: Validar el HTML
        run: npx --yes html-validate@8 --preset standard,a11y "*.html"

  publicar:
    needs: probar             # solo publica si las pruebas pasan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
